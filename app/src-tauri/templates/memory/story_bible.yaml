# ============================================================
# 故事圣经 - 全局世界观和写作规则
# ============================================================

title: "桥下的人"
genre: "现实主义 / 家庭 / 底层命运 / 荒诞黑色幽默"
tone: "冷静、朴素、克制，带一点荒诞和苦涩的幽默"

# 叙事控制·书级默认（可选）。生成时可在「章节工作台」按章覆盖。
# 经验：形式/叙事规则用英文表述更贴合模型；内容仍用中文。
# pov 取值：limited:<角色> / objective(隐形旁观，只写可见) / first:<角色> / omniscient
narrative_defaults:
  pov: "limited:王二"
  directives:
    - "Forensic Minimalism"
    - "Diegetic Observation only (no authorial summary of feelings)"

world_rules:
  - "故事发生在中国北方一个衰败的小县城，时间大约是二十世纪九十年代末到两千年初。"
  - "县城里有旧桥、肉铺、河堤、废弃电影院、国营厂宿舍、菜市场和小酒馆。"
  - "人物大多是普通人：下岗工人、小贩、临时工、老人、孩子、混混、乡镇干部。"
  - "故事不靠奇幻设定推动，而靠人物的误会、贫穷、沉默、亲情和命运推动。"
  - "重要事件往往以很平常的方式发生，不要写得像英雄史诗。"
  - "人物不会经常说大道理，他们更多是沉默、吃饭、抽烟、走路、忍着。"
  - "荒诞感来自生活本身，不要用夸张的网络段子制造笑点。"
  - "死亡、疾病、贫穷、亲情都可以写，但不要煽情，不要哭喊式表达。"

writing_rules:
  - "语言要朴素，句子可以短。"
  - "多写具体动作，少写抽象情绪。"
  - "人物的痛苦不要直接解释，通过吃饭、走路、摸口袋、看天、沉默表现。"
  - "对话要短，要像普通人说话。"
  - "可以有黑色幽默，但必须来自人物处境，而不是作者讲笑话。"
  - "叙事声音要冷静，不替人物喊冤。"
  - "场景里要有日常物件：塑料袋、烟头、搪瓷缸、破自行车、肉摊、煤炉、旧棉袄。"
  - "不要写华丽比喻，不要堆形容词。"
  - "每个场景最好有一个小动作作为核心，比如买肉、等人、修鞋、烧水、数钱。"
  - "人物关系要通过小事体现，不要靠大段回忆说明。"

forbidden_patterns:
  - "不要写成网文爽文。"
  - "不要出现系统、重生、修仙、豪门、霸总、逆袭打脸等套路。"
  - "不要写'他心中五味杂陈'。"
  - "不要写'她的眼泪夺眶而出'，除非真的非常必要。"
  - "不要写'命运的齿轮开始转动'。"
  - "不要写'这一刻，他终于明白了'。"
  - "不要用'首先、其次、最后'。"
  - "不要在段尾总结人生道理。"
  - "不要把人物说得太聪明，普通人常常不知道自己为什么这样做。"
