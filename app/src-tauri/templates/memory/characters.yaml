# ============================================================
# 角色档案
# ============================================================

characters:
  - name: "王二"
    role: "主角"
    identity: "县城肉铺临时工，三十二岁，离过一次婚"
    personality: "话少，反应慢，心里什么都明白但不愿说。怕麻烦，也怕亲人受苦。"
    speaking_style: "短句多，常用嗯、行、算了、没事。说话像没睡醒，但偶尔一句话很刺人。"
    current_status: "在菜市场肉铺帮人剁肉，住在旧厂宿舍，和父亲关系疏远。"
    secrets:
      - "他小时候曾看见父亲把母亲留下的一只银镯子卖掉，但一直没有说。"
    knows:
      - "父亲这些年一直住在桥洞附近，不愿回家。"
      - "自己欠前妻三千块钱，一直没还。"
    relationships:
      - "王老根: 父亲，关系僵硬，彼此都不愿先低头。"
      - "刘梅: 前妻，离婚后偶尔还来找他要钱。"
      - "小满: 女儿，跟着刘梅生活。"
    constraints:
      - "不会突然变得能言善辩。"
      - "不会主动说漂亮话。"
      - "遇到大事时先沉默，再做笨拙的行动。"

  - name: "王老根"
    role: "主角父亲"
    identity: "下岗老工人，六十二岁，常年在桥下和河堤边混日子"
    personality: "倔，爱面子，嘴硬。年轻时脾气坏，老了以后像一截潮湿的木头。"
    speaking_style: "声音粗，句子短，常带讽刺。喜欢用反问。"
    current_status: "住在旧桥下的小棚子里，靠捡废品和给人看自行车赚零花钱。"
    secrets:
      - "他当年卖掉银镯子不是为了喝酒，而是为了给王二母亲买药。"
      - "他最近咳血，但没有告诉王二。"
    knows:
      - "王二恨他。"
      - "自己可能活不了太久。"
    relationships:
      - "王二: 儿子，彼此有怨。"
      - "老马: 桥下认识的废品贩子，经常一起抽烟。"
    constraints:
      - "不会主动示弱。"
      - "不会直接说爱儿子。"
      - "身体不好，但仍然装作没事。"

  - name: "刘梅"
    role: "王二前妻"
    identity: "小饭馆服务员，三十岁，带着女儿小满生活"
    personality: "实际，嘴快，心软但不愿承认。"
    speaking_style: "说话直接，经常带一点火气。"
    current_status: "在火车站旁边的小饭馆上班，生活紧巴。"
    secrets:
      - "她并不是真的恨王二，只是觉得跟他过日子没有盼头。"
    knows:
      - "王二没钱。"
      - "小满其实很想见王二。"
    relationships:
      - "王二: 前夫，失望但还有牵连。"
      - "小满: 女儿，是她生活的中心。"
    constraints:
      - "不会变成恶毒前妻。"
      - "要钱时可以凶，但不是为了羞辱王二。"

  - name: "小满"
    role: "王二的女儿"
    identity: "七岁小女孩，上小学一年级"
    personality: "安静，懂事得有点早。"
    speaking_style: "话少，问问题直接。"
    current_status: "跟着母亲刘梅生活，很少见父亲。"
    secrets: []
    knows:
      - "父亲王二住得很远，也没什么钱。"
      - "母亲不喜欢提父亲。"
    relationships:
      - "王二: 父亲，亲近又陌生。"
      - "刘梅: 母亲，依赖她。"
    constraints:
      - "不要写成神童。"
      - "不要说成年人式的大道理。"

  - name: "老马"
    role: "配角"
    identity: "桥下废品贩子，五十多岁"
    personality: "油滑，爱开玩笑，看起来没心没肺，其实很怕孤独。"
    speaking_style: "话多，喜欢拿倒霉事开玩笑。"
    current_status: "和王老根一起在桥边混日子。"
    secrets:
      - "他有个儿子在南方打工，已经三年没联系。"
    knows:
      - "王老根咳血。"
      - "王老根其实一直惦记王二。"
    relationships:
      - "王老根: 老朋友，经常互相损。"
    constraints:
      - "不能变成纯搞笑角色。"