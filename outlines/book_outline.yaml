# ============================================================
# 全书大纲
# ============================================================

title: "桥下的人"
target_word_count: "8万-12万字"
genre: "现实主义 / 家庭 / 底层命运"
core_theme: "人和人之间的亏欠，有时候不是靠一句道歉解决，而是靠很久以后的一顿饭、一件旧衣服、一次沉默的陪伴。"

logline: "县城肉铺临时工王二多年不愿见父亲，直到父亲住在桥下、身体恶化，他才一步步发现当年家庭破裂背后的真相。"

main_conflict:
  external: "王二贫穷、离婚、欠钱，还要面对父亲的病和女儿的疏远。"
  internal: "王二恨父亲，又无法真正放下父亲。"
  emotional: "父子二人都不会表达爱，只会用难听的话和笨拙的行动靠近。"

structure:
  act1_setup:
    chapters: "ch001-ch005"
    function: "建立县城环境、王二的生活、父子疏离、桥下父亲的处境。"
    key_turning_point: "王二发现父亲咳血，但父亲死不承认。"

  act2_confrontation:
    chapters: "ch006-ch018"
    function: "王二被前妻要钱、女儿生病、父亲病情加重，旧家庭秘密逐渐浮出水面。"
    key_turning_point: "王二发现父亲当年卖镯子不是为了喝酒，而是为了给母亲治病。"

  act3_resolution:
    chapters: "ch019-ch030"
    function: "父子关系缓慢修复，但生活没有奇迹。王二学会承担一些以前逃避的东西。"
    key_turning_point: "王老根在冬天前住进王二的小屋，两人还是吵架，但开始一起吃饭。"

major_arcs:
  王二:
    start: "麻木、躲避、觉得自己这一生就这样了。"
    middle: "被父亲、前妻、女儿重新拖回家庭关系。"
    end: "没有变成成功人士，但开始像一个父亲和儿子那样活着。"

  王老根:
    start: "嘴硬、贫穷、拒绝回家。"
    middle: "病情暴露，旧事被一点点揭开。"
    end: "不再解释自己的一生，只接受儿子给他端来的一碗面。"

  刘梅:
    start: "现实、失望，对王二没有期待。"
    middle: "因为小满重新与王二产生交集。"
    end: "不复婚，但允许王二作为父亲靠近小满。"

  小满:
    start: "对父亲陌生。"
    middle: "通过一些小事慢慢接近父亲。"
    end: "接受父亲不完美，但知道他会来。"

ending_direction: "开放式温和结尾。没有发财，没有大团圆。冬天早晨，王二给父亲煮面，小满在旁边写作业，锅里的水开了，三个人都没有说话。"