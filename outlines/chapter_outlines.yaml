chapters:
  ch001:
    title: 半斤肉
    pov: 王二
    summary: 王二下班后买了半斤肉，去旧桥下看父亲。父子二人说了几句难听又平常的话。王二发现父亲咳嗽得厉害，还看见父亲反复摸胸口内袋。
    scenes:
      scene001:
        title: 肉铺收摊
        goal: 建立王二的日常生活：在菜市场肉铺帮工，收入低，性格沉默。通过他买半斤肉这个动作，引出他要去看父亲。
        location: 县城菜市场肉铺
        characters:
        - 王二
        - 肉铺老板
        conflict: 王二想买便宜点的肉，但又不想显得太寒酸。
        ending_hook: 王二提着肉走向旧桥，天快黑了。
      scene002:
        title: 旧桥下面
        goal: 王二见到住在桥下的父亲王老根。两人对话冷淡，互相讽刺，但能看出彼此都在意对方。
        location: 旧桥下
        characters:
        - 王二
        - 王老根
        - 老马
        conflict: 王二想让父亲回旧厂宿舍住，父亲嘴硬拒绝。
        ending_hook: 王老根咳了一阵，手帕上有一点暗红，他迅速攥住。
      scene003:
        title: 一锅肉汤
        goal: 王二在桥下临时小炉子上煮肉汤。父子一起吃饭，但没有温情表白。王二注意到父亲反复摸胸口内袋。
        location: 桥下小棚子
        characters:
        - 王二
        - 王老根
        conflict: 王二想问父亲是不是病了，但问不出口。父亲故意岔开话题。
        ending_hook: 王二离开后，王老根从内袋里摸出一张皱巴巴的医院单据。
  ch002:
    title: 三千块钱
    pov: 王二
    summary: 刘梅来肉铺找王二，要他还欠下的三千块钱。王二拿不出来，只能答应月底想办法。小满在饭馆门口看见王二，却没有叫他爸爸。
    scenes:
      scene001:
        title: 刘梅来了
        goal: 刘梅到肉铺找王二要钱，展示两人的离婚关系和现实压力。
        location: 菜市场肉铺
        characters:
        - 王二
        - 刘梅
        - 肉铺老板
        conflict: 刘梅要钱，王二没钱。
        ending_hook: 刘梅说小满下周学校要交钱，让他自己看着办。
      scene002:
        title: 火车站小饭馆
        goal: 王二去找刘梅，想解释自己暂时没钱，却在门口看见小满。
        location: 火车站旁小饭馆
        characters:
        - 王二
        - 刘梅
        - 小满
        conflict: 王二想靠近女儿，小满却显得陌生。
        ending_hook: 小满看了他一眼，低头继续吃面，没有叫他。
      scene003:
        title: 空口袋
        goal: 王二回到宿舍翻钱，只找到几张零钱和旧票据。
        location: 旧厂宿舍
        characters:
        - 王二
        conflict: 王二意识到自己既不是好儿子，也不是好父亲。
        ending_hook: 他在抽屉里翻出一张小满小时候画的画，上面三个人站在桥上。
  ch003:
    title: 咳嗽
    pov: 王二
    summary: 王二再次去桥下，发现父亲病情更重。老马偷偷告诉他，王老根已经咳血好几天。王二想带父亲去医院，父亲说医院是给有钱人死的地方。
    scenes:
      scene001:
        title: 老马的话
        goal: 老马告诉王二，王老根咳血不是一天两天。
        location: 旧桥边
        characters:
        - 王二
        - 老马
        conflict: 王二不想承认事情严重。
        ending_hook: 老马说，'他那手帕，洗都洗不干净了。'
      scene002:
        title: 去不去医院
        goal: 王二劝父亲去医院，父亲拒绝。
        location: 桥下小棚子
        characters:
        - 王二
        - 王老根
        conflict: 父子争吵，实际是在争谁有资格管谁。
        ending_hook: 王老根说：'你小时候我没管好，现在你也别管我。'
      scene003:
        title: 桥上的风
        goal: 王二离开桥下，在桥上站了很久，想起小时候母亲的银镯子。
        location: 旧桥
        characters:
        - 王二
        conflict: 王二第一次开始怀疑自己记忆里的父亲是否完整。
        ending_hook: 桥下有人摆摊，摊上有一只发黑的银镯子。
