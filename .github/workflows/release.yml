name: Release

# 自动打包并发布到 GitHub Releases：
#   • 每次 push 到 main          → 自动更新「latest」滚动预发布
#   • 推送形如 v0.1.0 的 tag     → 出对应版本的「正式版草稿」，确认后手动 Publish
#   • Actions 页手动 Run workflow → 同 latest
# 注意：不对 push 加 paths 过滤——否则 tag 推送（无文件变更）会被跳过而不触发构建。
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 连续推送时取消上一次未完成的构建，避免堆积
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64) → .dmg
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest # Intel (x86_64) → .dmg
            args: "--target x86_64-apple-darwin --bundles dmg"
          - platform: ubuntu-22.04 # → .AppImage / .deb
            args: "--bundles appimage,deb"
          - platform: windows-latest # → NSIS setup.exe
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # tag 触发 → 用该版本号出正式版草稿；其余（push main / 手动）→ 滚动更新 latest 预发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Sodarie Novel {0}', github.ref_name) || 'Sodarie Novel (latest)' }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          releaseBody: |
            Sodarie Novel —— 本地大模型长篇小说写作台。

            下载对应平台的安装包：
            - Windows：`*-setup.exe`（NSIS 安装器）
            - macOS：`*.dmg`（arm64 / x64）
            - Linux：`*.AppImage` 或 `*.deb`

            首次使用：打开后到「设置」填入本地 OpenAI 兼容服务地址（含 http://，多数在 /v1 下），即可开始。
            注：安装包未做代码签名，首次打开可能需在系统中允许运行。
          args: ${{ matrix.args }}
